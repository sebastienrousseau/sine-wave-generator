packages:
  - "."

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Security overrides: transitive packages with published advisories.
# pnpm 11 no longer reads `pnpm.overrides` from package.json — this is
# the supported home for the setting.
overrides:
  '@babel/plugin-transform-modules-systemjs@>=7.0.0 <8.0.0': '^7.29.4'
  'brace-expansion@>=1.0.0 <2.0.0': '^1.1.16'
  'brace-expansion@>=2.0.0 <3.0.0': '^2.1.2'
  'esbuild@>=0.0.0 <1.0.0': '^0.28.1'
  'fast-uri@>=3.0.0 <4.0.0': '^3.1.5'
  'flatted@>=3.0.0 <4.0.0': '^3.4.2'
  'js-yaml@>=3.0.0 <4.0.0': '^3.15.1'
  'js-yaml@>=4.0.0 <5.0.0': '^4.3.1'
  'lodash@>=4.0.0 <5.0.0': '^4.18.0'
  'minimatch@>=3.0.0 <4.0.0': '^3.1.3'
  'minimatch@>=9.0.0 <10.0.0': '^9.0.7'
  'picomatch@>=4.0.0 <5.0.0': '^4.0.4'
  'serialize-javascript@>=7.0.0 <8.0.0': '^7.0.5'
  'uuid@>=11.0.0 <12.0.0': '^11.1.1'
