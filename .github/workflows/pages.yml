# Deploys the site to GitHub Pages with GitHub Actions.
#
# The committed output in docs/ is uploaded unchanged; this workflow
# does not regenerate it. This follows the exception in AGENTS.md
# section 7.1.3 (GitHub Pages: deployed by GitHub Actions only) for a
# site whose committed output its generator can no longer rebuild.
# Porting the site to the current generator is a separate, reviewed
# change.
#
# actions/upload-pages-artifact leaves out .git, .github and other
# dotfiles, as the legacy Jekyll build did.
#
# A custom domain, if any, is kept in the repository's Pages settings
# (cname), which a workflow deployment uses, so no CNAME file is needed;
# an existing CNAME file is left in place.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Upload site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload committed site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
